-- MyPocketOS - Conky システム情報表示
-- CrunchBang系を参考にした、画面右上に常時表示するシンプルな情報パネル。
--
-- 参照: man conky(1) (conky-std 1.22.1, Debian 13 trixie)
--       /etc/conky/conky.conf (conky-std 公式デフォルト設定)
--
-- 方針:
-- - 外部コマンド実行 (exec/execi) は使用しない
-- - own_window_transparent (ARGB visualなし) によるコンポジタ不要の疑似透明背景
-- - フォントは日本語グリフを含む Noto Sans Mono CJK JP (fonts-noto-cjk) を使用
-- - 起動モード表示はConky組み込みのLua ($lua、外部プロセスを起動しない) で
--   XDG_RUNTIME_DIR配下の状態ファイルを読む。mypocketos-boot-mode.lua参照。
-- - ネットワーク使用状況 (Down/Up) は、特定インターフェース名 (wlan0/eth0等)
--   をハードコードせず、${downspeed ${gw_iface}}/${upspeed ${gw_iface}}
--   という、Conky変数の引数に別のConky変数(${gw_iface}、default route
--   のinterface名)を直接ネストさせる記法で実現する(2026-09-07再修正)。
--   接続の有無は${if_match "${gw_iface}" != "none"}と
--   ${if_match "${gw_iface}" != "multiple"}の入れ子で判定する。この記法は
--   Conky公式ドキュメントには明記されていないが、実際にビルド済み
--   conky-std 1.22.1バイナリ (out_to_x=falseの一時設定・複数回更新)で、
--   ${downspeed ${gw_iface}}が${downspeed <実interface名>}と常に同一の
--   値を返し、かつ実際の通信量の増減を正しく反映することを確認済み。
--
--   2026-09-06に採用していた「引数なしの${downspeed}/${upspeed}をConky
--   内部のデバイス自動選択に委ねる」方式は、実機でdefault route
--   interfaceを正しく選ばずDown/Upが常に0Bになる不具合が確認された。
--   2026-09-07にその修正として採用した「mypocketos-network.luaで
--   conky_parse()を使い、Lua側でinterfaceを解決してから
--   ${downspeed IFACE}を組み立てる」方式は、実機で
--   "attempt to call a nil value"というLua実行時エラーを起こし
--   ラベルだけ表示され値が空欄になる不具合が確認された(${lua ...}から
--   呼ばれるLua関数内でconky_parse()を再帰的に呼ぶことが、Conkyの
--   ネットワーク統計の内部状態と競合し、不安定な挙動(nil呼び出し・
--   空文字列)を引き起こすことが、実際のconky-std 1.22.1バイナリでの
--   検証により判明した)。今回はLuaヘルパーを完全に廃止し、Conky標準の
--   変数ネスト機能のみで完結する、より単純で堅牢な実装へ置き換えた。
--
--   2026-09-08: ネットワーク表示のレイアウトを、「ネットワーク:」見出し
--   +「Down:」「Up:」の3行表示から、「ネットワーク:  Down <値> / Up <値>」
--   の1行表示へ変更した(ロジック自体は上記のまま変更なし)。
--
--   なお、上記の取得ロジック自体 (${gw_iface}・${downspeed ${gw_iface}}等)
--   は実機で単体では正常動作することを確認済みだが、Conkyがネットワーク
--   接続確立前に起動していると、そのConkyプロセスの生存中はネットワーク
--   デバイスの内部状態が更新されず、後から接続してもDown/Upが0Bのまま
--   変化しない不具合が別途実機で確認された(2026-09-07 3度目の修正)。
--   この対応はConky側の取得ロジックをこれ以上複雑化せず、
--   NetworkManagerの接続確立イベントでConkyを再起動する
--   config/includes.chroot/etc/NetworkManager/dispatcher.d/
--   01-mypocketos-conky-restart で行う(このファイル自体には変更なし)。
--
--   2026-09-08 (6commit目): ネットワーク速度・メモリ・ルートFS等の
--   値が変化するたびに、Conkyウィンドウ全体の横幅も変化してしまう
--   (${alignr}で右寄せしている値の文字数が変わるとウィンドウが左右に
--   伸縮する) ことが実機で確認された。minimum_widthのみを指定していた
--   ため、実際の描画幅は内容に応じて自動的に広がっていた。
--
--   これを、minimum_width と maximum_width を同一値 (310) に設定する
--   ことで、ウィンドウの横幅をほぼ固定した (alignment='top_right'の
--   ため、右端の位置がほぼ固定される)。310という値は、本セッションの
--   サンドボックス環境で実際に稼働するX11ディスプレイ・実フォント
--   (Noto Sans Mono CJK JP) を使い、ビルド済みconky-std 1.22.1バイナリを
--   実際にX出力させ、xwininfoで実際の描画幅を測定して決めた
--   (推測で決め打ちしていない)。具体的には、想定しうる最も長い値
--   (ホスト名`mypocketos`・カーネル`6.12.107+deb13-amd64`・メモリ/
--   ルートFS使用率100%・ネットワーク速度999.9MiB等)を仮定した場合の
--   自然な描画幅が298pxであることを実測し、既存の見た目を保ったまま
--   その値に収まる310pxを採用した。
--
--   ただし、この固定幅化にも実測上ごく僅かな残差 (異なる内容間で
--   数px程度) が残ることを確認している。これはConkyの${alignr}計算が
--   実際の文字列のグリフ幅 (Xftによる可変幅フォントの字送り) を都度
--   再計算することに起因すると考えられ、本プロジェクトの範囲では
--   ${alignr}ベースの配置自体を作り直すことはせず、この程度の残差は
--   許容している。以前の (minimum_widthのみで無制限に伸縮していた)
--   状態と比べれば、変動幅は大幅に縮小している。

conky.config = {
    lua_load = os.getenv('HOME') .. '/.config/conky/mypocketos-boot-mode.lua',

    alignment = 'top_right',
    gap_x = 16,
    gap_y = 16,
    minimum_width = 310,
    maximum_width = 310,
    minimum_height = 5,
    background = false,
    update_interval = 2.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    double_buffer = true,
    no_buffers = true,

    use_xft = true,
    font = 'Noto Sans Mono CJK JP:size=10',
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'black',

    draw_borders = false,
    border_width = 0,
    border_inner_margin = 8,
    border_outer_margin = 0,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,

    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = false,

    out_to_x = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_wayland = false,

    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    uppercase = false,
    use_spacer = 'none',
}

conky.text = [[
${font Noto Sans Mono CJK JP:bold:size=13}MyPocketOS${font}
${color grey}${hr 1}$color
${color grey}ホスト名:$color ${alignr}${nodename}
${color grey}カーネル:$color ${alignr}${kernel}
${color grey}稼働時間:$color ${alignr}${uptime}
${color grey}起動モード:$color ${alignr}${lua mypocketos_boot_mode}
${color grey}CPU使用率:$color ${alignr}${cpu}%
${cpubar 6}
${color grey}メモリ:$color ${alignr}${mem} / ${memmax} (${memperc}%)
${membar 6}
${color grey}ルートFS (/):$color ${alignr}${fs_used /} / ${fs_size /} (${fs_used_perc /}%)
${fs_bar 6 /}
${if_match "${gw_iface}" != "none"}${if_match "${gw_iface}" != "multiple"}${color grey}ネットワーク:$color ${alignr}Down ${downspeed ${gw_iface}} / Up ${upspeed ${gw_iface}}${else}${color grey}ネットワーク:$color ${alignr}未接続${endif}${else}${color grey}ネットワーク:$color ${alignr}未接続${endif}
${color grey}${hr 1}$color
${color grey}ショートカット$color
Super+Space  アプリメニュー
Super+T      端末
Super+E      ファイルマネージャー
Alt+F4       ウィンドウを閉じる
Alt+Tab      ウィンドウ切り替え
${color grey}${hr 1}$color
${color grey}ウィンドウスナップ$color
Super+Left   左半分
Super+Right  右半分
Super+Up     最大化
Super+Down   最大化解除
]]
