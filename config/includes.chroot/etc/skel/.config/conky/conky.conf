-- MyPocketOS - Conky システム情報表示
-- CrunchBang系を参考にした、画面右上に常時表示するシンプルな情報パネル。
--
-- 参照: man conky(1) (conky-std 1.22.1, Debian 13 trixie)
--       /etc/conky/conky.conf (conky-std 公式デフォルト設定)
--
-- 方針:
-- - 外部コマンド実行 (exec/execi) は使用しない
-- - own_window_transparent (ARGB visualなし) によるコンポジタ不要の疑似透明背景
-- - フォントは日本語グリフを含む Noto Sans Mono CJK JP (fonts-noto-cjk) を使用
-- - 起動モード表示はConky組み込みのLua ($lua、外部プロセスを起動しない) で
--   XDG_RUNTIME_DIR配下の状態ファイルを読む。mypocketos-boot-mode.lua参照。
-- - ネットワーク使用状況 (Down/Up) は、特定インターフェース名 (wlan0/eth0等)
--   をハードコードせず、${downspeed ${gw_iface}}/${upspeed ${gw_iface}}
--   という、Conky変数の引数に別のConky変数(${gw_iface}、default route
--   のinterface名)を直接ネストさせる記法で実現する(2026-09-07再修正)。
--   接続の有無は${if_match "${gw_iface}" != "none"}と
--   ${if_match "${gw_iface}" != "multiple"}の入れ子で判定する。この記法は
--   Conky公式ドキュメントには明記されていないが、実際にビルド済み
--   conky-std 1.22.1バイナリ (out_to_x=falseの一時設定・複数回更新)で、
--   ${downspeed ${gw_iface}}が${downspeed <実interface名>}と常に同一の
--   値を返し、かつ実際の通信量の増減を正しく反映することを確認済み。
--
--   2026-09-06に採用していた「引数なしの${downspeed}/${upspeed}をConky
--   内部のデバイス自動選択に委ねる」方式は、実機でdefault route
--   interfaceを正しく選ばずDown/Upが常に0Bになる不具合が確認された。
--   2026-09-07にその修正として採用した「mypocketos-network.luaで
--   conky_parse()を使い、Lua側でinterfaceを解決してから
--   ${downspeed IFACE}を組み立てる」方式は、実機で
--   "attempt to call a nil value"というLua実行時エラーを起こし
--   ラベルだけ表示され値が空欄になる不具合が確認された(${lua ...}から
--   呼ばれるLua関数内でconky_parse()を再帰的に呼ぶことが、Conkyの
--   ネットワーク統計の内部状態と競合し、不安定な挙動(nil呼び出し・
--   空文字列)を引き起こすことが、実際のconky-std 1.22.1バイナリでの
--   検証により判明した)。今回はLuaヘルパーを完全に廃止し、Conky標準の
--   変数ネスト機能のみで完結する、より単純で堅牢な実装へ置き換えた。
--
--   2026-09-08: ネットワーク表示のレイアウトを、「ネットワーク:」見出し
--   +「Down:」「Up:」の3行表示から、「ネットワーク:  Down <値> / Up <値>」
--   の1行表示へ変更した(ロジック自体は上記のまま変更なし)。
--
--   なお、上記の取得ロジック自体 (${gw_iface}・${downspeed ${gw_iface}}等)
--   は実機で単体では正常動作することを確認済みだが、Conkyがネットワーク
--   接続確立前に起動していると、そのConkyプロセスの生存中はネットワーク
--   デバイスの内部状態が更新されず、後から接続してもDown/Upが0Bのまま
--   変化しない不具合が別途実機で確認された(2026-09-07 3度目の修正)。
--   この対応はConky側の取得ロジックをこれ以上複雑化せず、
--   NetworkManagerの接続確立イベントでConkyを再起動する
--   config/includes.chroot/etc/NetworkManager/dispatcher.d/
--   01-mypocketos-conky-restart で行う(このファイル自体には変更なし)。
--
--   2026-09-08 (6commit目): ネットワーク速度・メモリ・ルートFS等の
--   値が変化するたびに、Conkyウィンドウ全体の横幅も変化してしまう
--   (${alignr}で右寄せしている値の文字数が変わるとウィンドウが左右に
--   伸縮する) ことが実機で確認された。minimum_widthのみを指定していた
--   ため、実際の描画幅は内容に応じて自動的に広がっていた。
--
--   これを、minimum_width と maximum_width を同一値 (310) に設定する
--   ことで、ウィンドウの横幅をほぼ固定した (alignment='top_right'の
--   ため、右端の位置がほぼ固定される)。310という値は、本セッションの
--   サンドボックス環境で実際に稼働するX11ディスプレイ・実フォント
--   (Noto Sans Mono CJK JP) を使い、ビルド済みconky-std 1.22.1バイナリを
--   実際にX出力させ、xwininfoで実際の描画幅を測定して決めた
--   (推測で決め打ちしていない)。具体的には、想定しうる最も長い値
--   (ホスト名`mypocketos`・カーネル`6.12.107+deb13-amd64`・メモリ/
--   ルートFS使用率100%・ネットワーク速度999.9MiB等)を仮定した場合の
--   自然な描画幅が298pxであることを実測し、既存の見た目を保ったまま
--   その値に収まる310pxを採用した。
--
--   ただし、この固定幅化にも実測上ごく僅かな残差 (異なる内容間で
--   数px程度) が残ることを確認している。これはConkyの${alignr}計算が
--   実際の文字列のグリフ幅 (Xftによる可変幅フォントの字送り) を都度
--   再計算することに起因すると考えられ、本プロジェクトの範囲では
--   ${alignr}ベースの配置自体を作り直すことはせず、この程度の残差は
--   許容している。以前の (minimum_widthのみで無制限に伸縮していた)
--   状態と比べれば、変動幅は大幅に縮小している。
--
--   2026-09-08 (7commit目): 6commit目でウィンドウ全体の横幅は固定した
--   ものの、メモリ・ルートFS・Networkの各行は依然として単一の
--   ${alignr}で行全体を右寄せしていたため、値の桁数が変わるたびに
--   「Down」「/」「Up」やメモリ/ルートFSの「/」の位置そのものが
--   左右に移動してしまう問題が実機で確認された(${alignr}は右端を
--   固定するだけで、その左側にある固定文字列ごと右寄せしてしまう
--   ため)。
--
--   これを、値ごとに固定の桁数を確保して${goto x}で「/」や区切り文字
--   の開始位置を絶対座標指定する方式に置き換えることで解消した。
--   ${goto x}は「次の要素をxピクセル位置から描画する」という
--   Conky公式ドキュメント記載の絶対位置指定であり、直前のテキストの
--   長さに依存しない。この性質は、本セッションのサンドボックス環境で
--   実際に稼働するX11ディスプレイ上でconky-std 1.22.1バイナリを
--   実際にX出力させ、xwdで実際にレンダリングされたウィンドウを
--   ピクセル単位でキャプチャし、値の文字数を変えた複数パターン
--   (例: "1"と"123456"、実測値"5.64GiB"と想定最大値"999.9MiB"など)
--   で${goto}直後の文字の開始x座標が完全に一致することを確認して
--   検証した(推測で座標を決め打ちしていない)。
--
--   なお、検証の過程で、${alignr N}を1行中に複数回使った場合
--   (${alignr N1}...${alignr N2}...) は、後方のalignrが前方の
--   alignrの右端位置計算に影響を与えてしまい、値の長さによって
--   前方の区切り文字の位置がずれることも実機相当の環境で確認された
--   (公式ドキュメントに明記されていない挙動)。このため、1行に
--   複数の可変値がある行(メモリ・ルートFS・Network)ではalignrの
--   多重使用を避け、${goto x}による絶対位置指定のみを用いている。
--
--   各${goto x}の値は、実際にレンダリングして測定した以下の実測値を
--   根拠に算出した: ボーダー余白8px(border_inner_margin)を起点に、
--   等幅フォント(Noto Sans Mono CJK JP)のASCII 1文字あたりの実測
--   字送り幅(約7.05px、10文字・20文字分の実測描画幅から算出)、
--   および各ラベル文字列("メモリ: "・"ルートFS (/): "・
--   "ネットワーク: Down "等)の実測描画幅を用い、値の表示領域として
--   ASCII換算9文字分(約64px)を確保していた。
--
--   2026-09-08 (8commit目): 7commit目の固定幅(64px)を実機で確認した
--   ところ、区切り位置は固定されたものの、値と区切り文字の間に大きな
--   空白ができ、行ごとの空白量もばらついて見た目が不揃いになる不具合が
--   判明した(例: 「メモリ: 764MiB    / 7.66GiB   (9%)」のように、
--   値の後ろに不自然な空白が生じた)。原因は、実機で実際に観測される
--   値の長さ(GiB/MiB/KiB単位・3桁までの数値というConkyのバイトサイズ
--   human readable表記により、ほぼ常に6〜7文字に収まる)に対して、
--   64px(ASCII 9文字分)という予約幅が過大だったことにある。
--
--   このため、値の表示領域をASCII換算7文字分(約50px)へ縮小した。
--   7文字という値は、1〜7commit目を通じてこれまでに実機・本セッション
--   環境の双方で実際に観測されたすべての値("5.64GiB"・"15.5GiB"・
--   "82.4GiB"・"110GiB"・"764MiB"・"25.8MiB"・"114MiB"・"3.83GiB"・
--   "145KiB"・"3.02KiB"・"26.5KiB"・"114KiB"・"6.25KiB"・"201KiB"等)
--   がいずれも6〜7文字に収まっていたことに基づく、根拠のある実測値の
--   上限であり、「安全のため広く取る」ような余分な余裕は持たせて
--   いない。7文字を超える理論上の値(例: 3桁の有効数字を超えるような
--   桁溢れ)が実際に発生した場合、値の末尾が次の${goto}アンカーへ
--   わずかに重なる可能性は排除できないが、本セッションで実際に
--   ${goto}へ意図的に短い幅を与えて検証したところ、後続要素は
--   goto先の座標へ強制的にジャンプする(前の内容が長すぎる場合は
--   重ね書きになる)ことを確認しており、この点は既知のトレードオフ
--   として14節に明記する。ネットワーク(Down/Up)は待機時に非常に
--   短い値("0B"・"25B"等)になることがあり、この場合は値と区切り
--   文字の間に相対的に大きめの空白ができるが、これはネットワーク
--   速度という値自体の性質上避けられないものであり、メモリ・
--   ルートFSと同じ7文字分の予約幅を適用している(実機で観測された
--   値がいずれも7文字以内であるため、安全側であることに変わりはない)。
--
--   【7commit目・8commit目は過去の実装であり、9commit目で撤回済み】
--   上記7commit目・8commit目で導入した${goto x}による固定カラム方式は、
--   メモリ・ルートFS・Networkの3行についてVM確認を行ったところ、
--   「区切り文字位置はある程度固定できるが、行ごとの空白が不自然で、
--   表のようにきれいには見えず、ショートカット欄のような整然とした
--   印象にならない」との評価となり、6commit目までの${alignr}による
--   単純な右揃え表示の方が見やすいと判断された。このため、9commit目
--   (下記)で${goto x}による固定カラム化を撤回し、メモリ・ルートFS・
--   Networkの3行を${alignr}ベースの右揃え表示へ戻した。7commit目・
--   8commit目の上記コメントは、なぜ${goto x}方式を検討・採用したか
--   という経緯の記録として残しているが、現在のconky.textの実装
--   ではない。
--
--   2026-09-08 (9commit目): メモリ・ルートFS・Networkの3行を、
--   7・8commit目で採用していた${goto x}による固定カラム方式から、
--   6commit目までと同じ${alignr}による単純な右揃え表示へ戻した。
--   区切り文字・値の位置を1pxも動かさないことよりも、行として自然に
--   まとまって見えることを優先する方針への変更に伴う対応であり、
--   値の桁数によって行全体の右寄せ位置(≒区切り文字の位置)が多少
--   動くことは許容する。minimum_width/maximum_width = 310(6commit目)
--   による、ウィンドウ全体の横幅固定自体は維持しているため、6commit目
--   で報告された「ウィンドウ全体の横幅が値によって変化する」という
--   問題(19節相当)は再発しない。あくまで、行内部での区切り文字の
--   ピクセル単位の固定という7・8commit目の試みのみを撤回している。
--   Network取得ロジック・NetworkManager dispatcher・フォント・
--   パネル幅には一切変更を加えていない。
--
--   2026-09-09 (10commit目): 9commit目入りISOのVM確認で、
--   ${alignr}ベースの右揃え表示は7・8commit目より明らかに自然に
--   見えると評価されたが、実際の通信中(Down 480KiB / Up 36.9KiB
--   程度)のNetwork行に対して、310pxの固定幅はやや広すぎるとの
--   フィードバックがあった。minimum_width/maximum_widthを310から
--   300へ縮小した。
--
--   300という値は、本セッションで実際に稼働するX11ディスプレイ上で
--   ビルド済みconky-std 1.22.1バイナリを動かし、想定しうる長めの値
--   (ホスト名`mypocketos`・カーネル`6.12.107+deb13-amd64`・メモリ/
--   ルートFS使用率100%)と、ユーザーが最も幅の合う例として提示した
--   ネットワーク速度(`Down 480KiB / Up 36.9KiB`)を組み合わせた
--   conky.textを、幅制約なしでレンダリングして実測した自然な描画幅
--   (281px)を基準に決定した(推測で決め打ちしていない)。300pxで、
--   この内容がクリッピング・折り返しなく収まることに加え、より
--   極端な想定(ネットワーク速度999.9MiB相当)でも右端が画面外へ
--   はみ出さないことも実測して確認済み。
--
--   なお、本セッションの検証環境では、minimum_width/maximum_widthを
--   同一値に明示指定すると、実際に描画されるウィンドウ幅が要求値より
--   常に約20px大きくなる(例: 300を要求すると実測320pxになる)という
--   一貫した挙動が確認された。これは要求した値ごとに一定量加算される
--   もので、内容の長さには依存しないため、Conky内部の文字幅計算という
--   よりも、本セッション環境のウィンドウマネージャ(GNOME/Mutter、
--   Xwayland経由)側がConkyの「装飾なしウィンドウ」リサイズ要求に対して
--   独自の余白を付加している可能性が高い。MyPocketOSの実際のLive環境は
--   LightDM+Openbox(GNOME/Mutlerではない、より単純なウィンドウ
--   マネージャ)であり、この余白が実機・VM(Openbox)でも同様に発生する
--   保証はない。このため、300という値そのものは実測に基づいているが、
--   実際に画面上で何pxとして表示されるかは、本セッションの検証環境と
--   実際のVM/実機とで異なりうる。ユーザーのVM確認で、依然として広すぎる
--   ・狭すぎる等の問題が見つかった場合は、値の再調整が必要である。
--
--   2026-09-09 (11commit目): 10commit目入りISOのVM確認で、
--   Network 1行表示・メモリ・ルートFS・カーネル・ショートカット・
--   Window Snap・日本語表示・右揃えレイアウトはいずれも正常だったが、
--   VMスクリーンショット上ではまだ右側に余白が見られ、「もうちょっと
--   狭くてもいけそう」という評価があった。minimum_width/maximum_width
--   を300から292へ縮小した。レイアウト方式(${alignr})・conky.text・
--   Network取得ロジック・NetworkManager dispatcher・フォント・
--   gap_x/gap_yには一切変更を加えていない。292という値は300からの
--   さらなる微調整であり、10commit目で実測した自然な描画幅(281px)
--   に対して11pxの余裕を持つ(300の19pxより詰まっているが、依然として
--   自然な描画幅を下回っていない)。
--
--   2026-09-09 (12commit目・現行): 11commit目入りISOのVM確認で、
--   表示は正常だったが、「変化が感じられません」との評価があり、
--   依然として右側に余白が感じられた。minimum_width/maximum_widthを
--   292から284へさらに縮小した。284pxは、10commit目で実測した自然な
--   描画幅(281px)にかなり近い値であり、本セッションで、想定しうる
--   長めの値(ホスト名・カーネル・メモリ/ルートFS使用率100%)と、
--   ユーザーがVMで確認済みの複数のネットワーク速度例
--   (`Down 480KiB / Up 36.9KiB`・`Down 206KiB / Up 5.87KiB`)、および
--   より極端な想定(ネットワーク速度999.9MiB相当)を、それぞれ284px
--   固定幅で実際にX出力させ、いずれもクリッピング・折り返しなく収まる
--   ことを確認した(推測で決め打ちしていない)。レイアウト方式
--   (${alignr})・conky.text・Network取得ロジック・NetworkManager
--   dispatcher・フォント・gap_x/gap_yには一切変更を加えていない。
--   本セッションの検証環境固有のウィンドウ幅加算挙動(上記10commit目
--   コメント参照)により、284という指定値そのものを実際の描画幅と
--   断定することはできない。
--
--   2026-09-09 (13commit目調査・変更なし): 12commit目までは「メモリ・
--   Network行の右側余白を数px削る」という理解で幅を縮小してきたが、
--   ユーザーの本来の意図は「ショートカット・Window Snap欄の右側に
--   残る大きな余白も含め、Conkyパネル全体をもっとスリムな縦長パネルに
--   すること」だと判明した。これを受け、conky.textの各行を1行ずつ
--   分離し、minimum_width=5(無制限)で個別にレンダリングして、各行が
--   単独で必要とする自然な幅を実測した:
--     ホスト名157px・カーネル227px・稼働時間157px・起動モード177px・
--     CPU使用率123px・メモリ100%時242px・ルートFS100%時270px・
--     ネットワーク(実機VM確認済みの実測値"Down 480KiB / Up 36.9KiB")
--     281px・ショートカット最長行("ファイルマネージャー"行)242px・
--     ウィンドウスナップ各行151px。
--
--   この結果、ショートカット・ウィンドウスナップの各行は151〜242pxしか
--   必要としておらず、パネル全体の右側余白の原因ではないことが判明した
--   (むしろ、これらの行は他の行より幅が不要なために、結果として右側に
--   余白が生じて見えている)。実際の幅のボトルネックはネットワーク行
--   であり、実機VMで確認済みの実測値だけでも281pxを要する。現在の
--   284pxはこれよりわずか3px広いだけであり、これ以上ユーザー提示の
--   候補値(280・276・272・268・264・260px)まで縮小すると、実機で
--   確認済みの通常の通信速度表示ですら、ラベル文字列の左端が画面外へ
--   はみ出し、一部の文字が失われる(単なる余白の減少ではなく、
--   情報の欠落)ことを、本セッションで意図的に幅を不足させた
--   レンダリングにより実際に確認した。
--
--   なお、ユーザーが今回の必須条件として挙げた"Down 999.9MiB / Up
--   999.9MiB"という文字列は、これまでのすべての実測値("5.64GiB"・
--   "15.5GiB"・"82.4GiB"・"110GiB"・"764MiB"等)が一貫して有効数字
--   3桁のパターン(X.XXまたはXX.Xまたは整数XXX、小数点付きは常に
--   4文字までのマンティッサ)に従っていることから、Conky自身の
--   ${downspeed}/${upspeed}が実際に出力しうる文字列ではないと考えられる
--   (この形式で実際に出力されうる最長のマンティッサは"99.9"であり、
--   "999.9"は出力されない)。この点を踏まえ、実際に出力されうる範囲での
--   より現実的な上限値("Down 99.9MiB / Up 99.9MiB")を別途実測した
--   ところ、288pxを要した。ユーザー指示どおりの文字どおりの
--   "999.9MiB"表記であれば302pxを要する。
--
--   結論として、ショートカット・ウィンドウスナップ欄を含む現在の
--   表示内容・${alignr}レイアウトを維持したまま、実機で確認済みの
--   ネットワーク速度表示(281px)を安全に収める限り、現在の284pxから
--   明確に狭くすることはできない(ボトルネックはネットワーク行)。
--   さらに狭くするには、ネットワーク行の"Down "/"Up "という語句を
--   削るか、各値の区切り記号周辺の空白を削るといった、表示内容
--   自体への変更が必要になる。これは今回のユーザー指示にある
--   「最小限のレイアウト調整」の範囲を超える判断が必要なため、
--   幅の変更は行わず、この調査結果をユーザーへ報告することとした。
--   （conky.config自体は284pxのまま変更していない）
--
--   2026-09-09 (14commit目・現行): 13commit目の調査結果を受け、ユーザーは
--   「メモリ・ルートFS・Networkの3行で、値と区切り記号("/")周辺の空白を
--   削る」という選択肢を選んだ(13commit目コメントの選択肢1)。これにより
--   ${mem} / ${memmax}のような「値 空白 / 空白 値」という表記を、
--   ${mem}/${memmax}のように空白なしの表記へ変更した(メモリ・
--   ルートFS・ネットワークの3行のみ。ラベル・"Down"/"Up"という語句・
--   ${alignr}方式自体・値そのもの・他の既存表示項目には一切手を
--   加えていない)。
--
--   この変更に伴い、各行の自然な必要幅が縮小することを、13commit目と
--   同じ「各行を個別に分離してminimum_width=5でレンダリングする」
--   手法で再実測した: メモリ100%時228px(242pxから縮小)・ルートFS
--   100%時256px(270pxから縮小)・ネットワーク(実機VM確認済みの実測値
--   "Down 480KiB/Up 36.9KiB")267px(281pxから縮小)・ネットワーク
--   (有効数字3桁で実際に出力されうる上限"Down 99.9MiB/Up 99.9MiB")
--   274px。
--
--   minimum_width/maximum_widthを284から278へ縮小した。278という値は、
--   実機VM確認済みの実測値の自然幅(267px)に11pxの余裕を持ち、かつ
--   Conky自身が実際に出力しうる範囲での現実的な上限(274px)にも4pxの
--   余裕を持つ値である(ユーザー指示の"999.9MiB"表記は、13commit目の
--   調査でConky自身が実際には出力しない形式と判明しているため、この
--   値については設計上の基準としていない)。本セッションで、この278px
--   固定幅を用いて、想定しうる長めの値・実機VM確認済みのネットワーク
--   速度例を含む全項目を実際にX出力させ、クリッピング・折り返しなく
--   収まることを確認した(推測で決め打ちしていない)。
--
--   本セッションの検証環境固有のウィンドウ幅加算挙動(10commit目参照)
--   により、278という指定値そのものを実際の描画幅と断定することは
--   できない。ただし、この加算挙動が実機・VM(Openbox)では発生しない
--   可能性を踏まえ、今回は本セッションでの見かけ上のレンダリング結果
--   ではなく、加算挙動の影響を受けない「各行を個別に分離した無制限
--   レンダリングでの自然幅の実測値」を安全基準として278という値を
--   決定した。
--
--   2026-09-09 (15commit目・現行): 14commit目入りISOのVM確認で、
--   区切り記号周辺の空白を削っただけでは「変わってないようにしか
--   見えません」との評価があり、ユーザーが求めていたのは数px単位の
--   幅削減ではなく、Conkyパネルそのものが見た目で明確にスリムになる
--   ことだと判明した。方針を見直し、Network表示を横1行に押し込む
--   前提を撤回し、1〜4commit目当時と同様の縦方向複数行表示へ戻した
--   (取得ロジック自体は変更なし)。
--
--   変更前(1行、5〜14commit目):
--     ${color grey}ネットワーク:$color ${alignr}Down ${downspeed ${gw_iface}}/Up ${upspeed ${gw_iface}}
--   変更後(3行、15commit目・現行):
--     ${color grey}ネットワーク:$color
--     ${color grey}  Down:$color ${alignr}${downspeed ${gw_iface}}
--     ${color grey}  Up:$color ${alignr}${upspeed ${gw_iface}}
--
--   "Down"/"Up"という語句、値そのもの(${downspeed ${gw_iface}}等)、
--   Network取得ロジック・NetworkManager dispatcherには一切変更を
--   加えていない。各行が単一の${alignr}のみを使う(1行に複数の
--   ${alignr}を使わない)という7〜9commit目で確立した安全な設計は
--   維持している。
--
--   この分割により、本セッションで各行を個別に分離してレンダリングし
--   直したところ、ネットワーク関連行の自然幅が大幅に縮小した
--   (見出し行106px・"  Down: 480KiB"行119px・"  Up: 36.9KiB"行112px、
--   いずれも旧1行表示の267pxを大きく下回る)。この結果、パネル全体の
--   幅を決めるボトルネックがネットワーク行からルートFS行(100%使用時
--   256px)へ移った。メモリ・ショートカット・ウィンドウスナップの各行
--   はいずれもルートFS行より狭いため、1行表示を維持したまま変更して
--   いない。
--
--   minimum_width/maximum_widthを278から262へ縮小した。262という値は、
--   ルートFS行の実測自然幅(256px、想定しうる最大値999GiB/999GiB
--   100%使用時)に6pxの余裕を持つ値である。本セッションで、262px
--   固定幅を用いて、想定しうる長めの値(メモリ/ルートFS使用率100%・
--   長めのカーネル文字列)と、実機VM確認済みのネットワーク速度例
--   (Down 480KiB/Up 36.9KiB)、より極端な想定(Down 999.9MiB/
--   Up 999.9MiB)のいずれについても、Network表示が3行に分かれている
--   ことでクリッピング・折り返しが発生しないことを実際にX出力させて
--   確認した(推測で決め打ちしていない)。
--
--   2026-09-10 (16commit目・現行): 15commit目入りISOのVM確認では表示
--   自体は正常だったが、ユーザーが求める「Conkyパネル全体が見た目で
--   明確に細くなる」という完成形には届いていなかった。原因は、
--   Network分割後は新たな幅のボトルネックがルートFS・メモリ等の
--   1行表示(ラベル+${alignr}値)に移っていたことにある。今回は
--   ホスト名・カーネル・稼働時間・起動モード・CPU使用率・メモリ・
--   ルートFSの7行についても、「ラベル行」+「半角スペース2文字分
--   インデントした値行」の2段構成へ変更した(15commit目のNetwork
--   縦分割と同じ考え方)。
--
--   変更前(1行、6〜15commit目):
--     ${color grey}ホスト名:$color ${alignr}${nodename}
--   変更後(2行、16commit目・現行):
--     ${color grey}ホスト名:$color
--       ${nodename}
--
--   値行は、Network行のDown/Upとは異なり${alignr}を使わず、ラベルと
--   同じ左端から半角スペース2文字分インデントした単純な左寄せ表示に
--   した。値を右寄せすると、この程度の幅の短い値(例:"mypocketos")
--   がウィンドウ右端まで押しやられ、行の左側に不自然な空白ができる
--   ため、ユーザー提示のイメージ(ラベル行の下に値を左寄せでインデント
--   表示する)に合わせた。CPU/メモリ/ルートFSバー(${cpubar}/${membar}/
--   ${fs_bar})・Network取得ロジック・NetworkManager dispatcher・
--   ショートカット5項目・ウィンドウスナップ4項目・フォント・色・
--   alignment・gap_x/gap_yには一切変更を加えていない。
--
--   本セッションで、conky.textの各行を1行ずつ分離し、minimum_width=5
--   (無制限)で個別にレンダリングして、新レイアウトの各行が単独で
--   必要とする自然な幅を実測した: ホスト名ラベル80px・値105px、
--   カーネルラベル80px・値175px、稼働時間ラベル80px・値105px、
--   起動モードラベル93px・値112px、CPU使用率ラベル88px・値63px、
--   メモリラベル67px・値(100%時)189px、ルートFSラベル109px・値
--   (100%時)175px。いずれも15commit目時点のルートFS行(256px、
--   ラベルと値が同一行の1行表示)を大きく下回った。
--
--   一方、変更していないショートカット・ウィンドウスナップの各行を
--   同じ手法で再実測したところ、最長行("Super+E      ファイル
--   マネージャー")が242pxを要することが判明した。これは新レイアウトの
--   どの行(最大189px)よりも広く、13commit目の調査時点(ネットワーク行
--   281pxがボトルネックだったため、ショートカット・ウィンドウスナップ
--   欄は問題にならなかった)とは異なり、今回はショートカット行自体が
--   新たな幅のボトルネックになっている。ユーザー指示によりショート
--   カット・ウィンドウスナップの文言短縮・削除は禁止されているため、
--   これらの行を維持する前提で安全な最小幅を決定する必要がある。
--
--   minimum_width/maximum_widthを262から248へ縮小した。248という値は、
--   ショートカット最長行の実測自然幅(242px)に6pxの余裕を持つ値であり、
--   13commit目以来の方針どおり1〜2px単位の限界値は狙わず、数px程度の
--   安全マージンを残している。ユーザーが探索の目安として提示した
--   230〜240px帯には、ショートカット・ウィンドウスナップの文言を
--   変更しない限り到達できないことが判明したため、この調査結果を
--   コメント・レビュー資料の両方に明記する。
--
--   本セッションで、248px固定幅を用いて、想定しうる長めの値(ホスト名・
--   カーネル・メモリ/ルートFS使用率100%)、実機VM確認済みのネットワーク
--   速度例(Down 480KiB/Up 36.9KiB)、より極端な想定(Down 999.9MiB/
--   Up 999.9MiB)を含む全項目を実際にX出力させ、クリッピング・折り返し
--   なく収まることを確認した。また、意図的に幅を不足させた220px
--   (ショートカット最長行の自然幅242pxを下回る値)でも同じ内容を
--   レンダリングし、ショートカット行がクリッピングする方向の挙動と
--   なることを確認し、242pxという floor の実在性を裏付けた
--   (推測で決め打ちしていない)。
--
--   本セッションの検証環境固有のウィンドウ幅加算挙動(10commit目参照)
--   により、248という指定値そのものを実際の描画幅と断定することは
--   できない。今回も、加算挙動の影響を受けない「各行を個別に分離した
--   無制限レンダリングでの自然幅の実測値」を安全基準として248という
--   値を決定した。
--
--   2026-09-10 (17commit目・現行): 16commit目入りISOのVM確認で、
--   横幅の縮小自体には成功したものの、「個人的には前の並びのほうが
--   好き」との評価があった。ホスト名・カーネル・稼働時間・起動モード・
--   CPU使用率・メモリ・ルートFSの7行を縦方向2段(ラベル行+値行)に
--   分割したことで、情報が縦にばらけて一覧性が落ち、視線移動が増え、
--   システム情報全体が間延びして見えるという結果になったため、この
--   16commit目の縦積みレイアウトは見た目として不採用とし、この7行を
--   15commit目相当の1行表示(ラベル+${alignr}値)へ戻した。
--
--   変更前(2行、16commit目):
--     ${color grey}ホスト名:$color
--       ${nodename}
--   変更後(1行、17commit目・現行、15commit目相当に復元):
--     ${color grey}ホスト名:$color ${alignr}${nodename}
--
--   同様の変更を、ホスト名・カーネル・稼働時間・起動モード・CPU使用率・
--   メモリ・ルートFSの計7行に適用した。メモリ・ルートFSにおける、値と
--   区切り記号("/")周辺の空白なし表記(14commit目)は維持している。
--   Network行(15commit目の縦方向複数行表示)・Network取得ロジック・
--   NetworkManager dispatcher・ショートカット5項目・ウィンドウスナップ
--   4項目・フォント・色・alignment・gap_x/gap_yには一切変更を加えて
--   いない。
--
--   完成形は「システム情報7行は1行表示中心、Networkのみ縦方向3行」と
--   なった。ユーザーの優先順位(1. 見やすさ、2. 一覧性、3. 自然な
--   レイアウト、4. その範囲で可能な限りスリム)に基づき、16commit目の
--   ように横幅を削る代わりに一覧性を損なう方向へは戻らない方針とした。
--
--   16commit目の248pxは、システム情報の2段化を前提にした値であり、
--   1行表示へ戻すことで必要幅が再び増えるため、15commit目の262pxを
--   基準に再評価した。本セッションで、7行を1行ずつ分離し、
--   minimum_width=5(無制限)で個別にレンダリングして自然な幅を
--   再実測したところ、いずれも14〜15commit目当時と同じ値になった
--   (ホスト名157px・カーネル227px・稼働時間157px・起動モード177px・
--   CPU使用率123px・メモリ100%時228px・ルートFS100%時256px)。
--   ルートFS行(256px)が最大であり、これはショートカット最長行
--   (242px)・Network関連行(最大133px)のいずれよりも広いため、
--   15commit目と同じくルートFS行が幅のボトルネックとなる。262pxは
--   このルートFS行の自然幅に6pxの余裕を持つ値であり、この関係が
--   16commit目以前と変わっていないため、262pxをそのまま採用した
--   (16commit目のような再設計は行っていない)。
--
--   本セッションで、262px固定幅を用いて、想定しうる長めの値(ホスト名・
--   カーネル・メモリ/ルートFS使用率100%)、実機VM確認済みのネットワーク
--   速度例(Down 480KiB/Up 36.9KiB)、より極端な想定(Down 999.9MiB/
--   Up 999.9MiB)を含む全項目を実際にX出力させ、クリッピング・折り返し
--   なく収まることを確認した(推測で決め打ちしていない)。

conky.config = {
    lua_load = os.getenv('HOME') .. '/.config/conky/mypocketos-boot-mode.lua',

    alignment = 'top_right',
    gap_x = 16,
    gap_y = 16,
    minimum_width = 262,
    maximum_width = 262,
    minimum_height = 5,
    background = false,
    update_interval = 2.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    double_buffer = true,
    no_buffers = true,

    use_xft = true,
    font = 'Noto Sans Mono CJK JP:size=10',
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'black',

    draw_borders = false,
    border_width = 0,
    border_inner_margin = 8,
    border_outer_margin = 0,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,

    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = false,

    out_to_x = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_wayland = false,

    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    uppercase = false,
    use_spacer = 'none',
}

conky.text = [[
${font Noto Sans Mono CJK JP:bold:size=13}MyPocketOS${font}
${color grey}${hr 1}$color
${color grey}ホスト名:$color ${alignr}${nodename}
${color grey}カーネル:$color ${alignr}${kernel}
${color grey}稼働時間:$color ${alignr}${uptime}
${color grey}起動モード:$color ${alignr}${lua mypocketos_boot_mode}
${color grey}CPU使用率:$color ${alignr}${cpu}%
${cpubar 6}
${color grey}メモリ:$color ${alignr}${mem}/${memmax} (${memperc}%)
${membar 6}
${color grey}ルートFS (/):$color ${alignr}${fs_used /}/${fs_size /} (${fs_used_perc /}%)
${fs_bar 6 /}
${if_match "${gw_iface}" != "none"}${if_match "${gw_iface}" != "multiple"}${color grey}ネットワーク:$color
${color grey}  Down:$color ${alignr}${downspeed ${gw_iface}}
${color grey}  Up:$color ${alignr}${upspeed ${gw_iface}}${else}${color grey}ネットワーク:$color ${alignr}未接続${endif}${else}${color grey}ネットワーク:$color ${alignr}未接続${endif}
${color grey}${hr 1}$color
${color grey}ショートカット$color
Super+Space  アプリメニュー
Super+T      端末
Super+E      ファイルマネージャー
Alt+F4       ウィンドウを閉じる
Alt+Tab      ウィンドウ切り替え
${color grey}${hr 1}$color
${color grey}ウィンドウスナップ$color
Super+Left   左半分
Super+Right  右半分
Super+Up     最大化
Super+Down   最大化解除
]]
