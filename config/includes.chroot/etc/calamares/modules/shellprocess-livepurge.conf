#
# MyPocketOS独自: shellprocessモジュール "livepurge" インスタンス用設定。
# /etc/calamares/settings.conf の instances/sequence から
# `shellprocess@livepurge` として参照される。
#
# 目的: Debian公式 calamares-settings-debian が使う標準の `packages`
# モジュール(apt backend)は、除去対象パッケージのremove後に
#     apt-get --purge -q -y autoremove
# を無条件に実行する実装であり、これがsudo・user-setup等を「不要」と
# 誤判定して削除しようとし、sudoのpre-removalによる安全停止で
# インストールが失敗する原因になった(2026-09-13実機VM検証で確認、
# reports/ai-review/20260913-calamares-spike-autoremove-fix.md 参照)。
#
# 対策として、ここではLive専用パッケージのみを1回のapt-get purgeで
# 明示的に列挙して削除し、autoremoveは一切呼ばない。
#
# 削除対象の内訳:
#   - calamares-settings-debian が /etc/calamares/modules/packages.conf
#     (未変更のまま残置)に列挙している9パッケージ
#     (live-config-systemdの重複記載は1回にまとめた)
#   - live-boot-initramfs-tools
#     (calamares-settings-debianのpackages.confには含まれていないが、
#     2026-09-13の実機VM検証で、live-boot除去後にautoremove候補として
#     観測された。live-boot系列のinitramfsフックパッケージであり
#     installed systemに残す理由がないため、明示的な削除対象に含める)
#
# 意図的に削除しないもの(重要):
#   sudo・user-setup・cryptsetup・keyutils・libglib2.0-bin・rsync・
#   qml-module-qtquick2・qml-module-qtquick-window2・calamares 本体は
#   このリストに含めない。これらはCalamares/calamares-settings-debian
#   自体のランタイム依存、またはinstalled systemに必要なパッケージ
#   であり、汎用autoremoveに任せず明示指定のみで処理する今回の方針上、
#   「積極的には削除しない」を既定とする。
---
dontChroot: false

# apt-get remove/purge自体が長くかかる可能性があるため、既定の30秒より
# 長めに設定する。実測値は今回のVM検証では未確認のため、実機VM検証の
# 結果次第でさらなる調整が必要になる可能性がある。
timeout: 120

# apt-getの出力をCalamaresログへ1行ずつ記録する。原因調査時に有用なため
# 有効にする。
verbose: true

script:
    - "apt-get --purge -q -y remove live-boot live-boot-doc live-boot-initramfs-tools live-config live-config-doc live-config-systemd live-tools live-task-localisation live-task-recommended calamares-settings-debian"

i18n:
    name: "Removing live-only packages"
    name[ja]: "Live専用パッケージを削除しています"
