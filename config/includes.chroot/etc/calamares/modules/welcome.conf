#
# ==== MyPocketOS における位置づけ =====================================
# このファイルは、Debian公式パッケージ calamares-settings-debian が
# /etc/calamares/modules/welcome.conf として提供するファイルを、
# live-buildの config/includes.chroot 経由で上書きするMyPocketOS独自版
# である(live-buildはchroot local includesをパッケージインストール後に
# 適用するため、この配置で確実に上書きされる。settings.conf・
# partition.confのオーバーライドと同じ方式)。
#
# 変更点は requirements ブロックのみ:
#   - requiredStorage を 15 から 16 (GiB) へ変更
#   - requiredRam を 1.0 から 2.0 (GiB) へ変更
#   - check に internet を追加
#   - required に internet を追加(storage・ram・rootは既存のまま維持)
#   - internetCheckUrl を明示指定 (https://deb.debian.org/)
#
# 理由(MyPocketOS製品方針): 通常インストールにインターネット接続を
# 必須とする(2026-09-15、実機FMVU1400MPでのオフライン環境における
# Calamares自動インストール失敗を確認したため。UEFI時のbootloader-config
# フェーズがchroot内でgrub-efiをapt取得しようとするが、オフラインでは
# 取得に失敗し、後続のupdate-grubが存在せずexit code 127で失敗する。
# 詳細はreports/ai-review/20260915-calamares-install-requirements-
# investigation.md参照)。Calamares標準のwelcome requirements機能
# (このファイルのみで完結)を使い、独自QML(welcomeq)への移行や
# Calamares本体へのパッチは行わない。
#
# internetCheckUrlの選定理由(2026-09-15、実際のHTTP応答を確認済み):
#   https://deb.debian.org/ (パスなし、ルート)
#   - HTTPS・Debian公式管理ドメイン(Debian System Administrators運用、
#     ページ末尾の連絡先がdsa@debian.org)
#   - curlで直接確認: HTTP 200、リダイレクト0回、応答サイズ約1.9KB
#     (deb.debian.org/debian/dists/stable/Releaseの約135KBより大幅に
#     小さく、www.debian.org/の約16KBよりも小さい)
#   - Last-Modifiedが2023-09-01であり、長期間内容が変わっていない
#     静的な案内ページ(Debian archiveのCDN構成を説明するページ)
#   - deb.debian.orgは、実際にCalamaresのbootloader-configフェーズが
#     grub-efi取得のために到達する必要があるDebianパッケージアーカイブ
#     配信網そのものであり、「単にネットワークIFが繋がっているか」では
#     なく「MyPocketOSのインストールに必要なDebian側ネットワークへ
#     実際に到達できるか」を検証する目的に合致する
#   - bare domain (https://debian.org/) はHTTP 302を返す(リダイレクト
#     が発生する)ことをcurlで確認済みのため、リダイレクト依存を避ける
#     方針(調査時のユーザー指示)によりこちらは採用しなかった
#
# UI文言: 今回はCalamares標準の日本語翻訳をそのまま使用する。独自文言・
# .mo差し替え・独自QML等は実装していない(将来課題)。
#
# 再チェック制約: Calamares 3.3.14には、internet要件を満たさない状態で
# welcome画面を表示した後、Wi-Fi接続してもrequirementsを自動再評価する
# 機構が無い(調査report参照)。この制約を本ファイル・本branchで独自に
# 解決することはしない。初回版は「Wi-Fi接続後にCalamaresを起動する」
# 運用を前提とする。
#
# 保守上の注意: 上記の変更以外は、calamares-settings-debianが提供する
# welcome.confの内容をそのまま維持している(showSupportUrl等の表示設定
# は変更していない)。将来calamares-settings-debianパッケージが更新され
# た場合、このMyPocketOS版は自動的には追従しない。パッケージ更新時は
# salsa.debian.org/live-team/calamares-settings-debianの最新版と
# 差分を取り、必要であれば本ファイルを更新すること。
# =======================================================================
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

requirements:
    # 利用可能ディスク容量の最小値 (GiB)。MyPocketOS最小ストレージ要件
    # (16GB)に合わせる。
    requiredStorage:    16

    # 利用可能RAMの最小値 (GiB)。実際の判定では0.95倍された値との比較に
    # なるため(Calamares本体の実装、GeneralRequirements.cpp)、実質約
    # 1.9GiB以上の利用可能RAMで満たされる。
    requiredRam:        2.0

    # インターネット接続性の確認先。単一URLへのHTTP GETが成功(200等)
    # すればインターネット接続ありと判定される。選定理由は上記コメント
    # 参照。
    internetCheckUrl:   https://deb.debian.org/

    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - storage
        - ram
        - internet
        - root
