#
# ==== MyPocketOS における位置づけ =====================================
# このファイルは、他のCalamares設定オーバーライド(finished.conf等)とは
# 異なり、既存ファイルの上書きではない。calamares本体・
# calamares-settings-debianパッケージのいずれも
# /etc/calamares/modules/locale.conf を提供しておらず(2026-09-17調査、
# reports/ai-review/20260917-calamares-timezone-new-york-investigation.md
# 参照)、この設定ファイル自体がこれまで一切存在しなかった。
#
# 目的: Calamaresの「locale」モジュール(タイムゾーン選択画面)は、
# region/zoneが設定されていない場合、本体ソースコード
# (src/modules/locale/Config.cpp の getStartingTimezone())に
# ハードコードされた既定値 "America/New_York" を初期表示に使う。
# MyPocketOSはlocale.conf自体を提供していなかったため、常にこの
# ハードコード既定値がそのまま表示されていた(UEFI VM・実機
# FMVU1400MPの両方で再現確認済み)。
#
# 対応方針(MyPocketOS製品方針、2026-09-17決定): MyPocketOSは
# 日本語向け・Asia/Tokyoを正式な初期仕様とするため、region/zoneを
# 明示的にAsia/Tokyoへ固定する。Live環境の実行時timezone
# (auto/configの--bootappend-liveで設定されるtimezone=Asia/Tokyo)へ
# 動的に追従させる useSystemTimezone は、意図的に採用しない
# (Live側から万一別のtimezoneが返った場合に、この明示指定が上書き
# されてしまうことを避けるため)。GeoIPによる位置推定も、ネットワーク
# 依存を増やす方針のため採用しない。
#
# この既定値はあくまで初期表示のみを変更するものであり、Calamares
# インストール中にユーザーが地図上で別のタイムゾーンを手動選択する
# 自由を妨げるものではない。
#
# 保守上の注意: 本ファイルはcalamares-settings-debianパッケージの
# 内容を上書きするものではない(そもそも同パッケージはこのファイルを
# 提供していない)ため、他のオーバーライドファイルのような「パッケージ
# 更新への追従」という保守上の懸念は生じない。
# =======================================================================
---
region: Asia
zone: Tokyo
