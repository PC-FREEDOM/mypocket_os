# ==== MyPocketOS における位置づけ =====================================
# このファイルは、Debian公式パッケージ calamares-settings-debian が
# /etc/calamares/modules/finished.conf として提供するファイルを、
# live-buildの config/includes.chroot 経由で上書きするMyPocketOS独自版
# である(live-buildはchroot local includesをパッケージインストール後に
# 適用するため、この配置で確実に上書きされる。settings.conf等と同じ方式)。
#
# 変更点はこの1点のみ:
#   restartNowCommand を "systemctl -i reboot" から
#   "/usr/local/bin/mypocketos-installer-reboot" へ変更した。
#
# 理由(MyPocketOS製品方針): インストール完了直後の再起動時に、
# インストールメディア(USB/CD・DVD)の取り外しを案内し、QEMU/KVM等の
# 仮想CD/DVDについてはeject試行を行いたい(reports/ai-review/
# 20260916-install-media-removal-investigation.md、reports/ai-review/
# 20260916-conditional-live-medium-eject-investigation.md 参照)。
# Debian Live標準(live-tools パッケージ)には本来この仕組み
# (/usr/bin/live-medium-eject、/usr/lib/systemd/system-shutdown/
# live-tools.shutdown)が既に存在するが、MyPocketOSは開発時のVM
# 反復再起動テストの利便性のため auto/config で `noeject` カーネル
# パラメータを常時指定しており(通常のLive再起動には今後も影響を
# 与えたくない)、この標準機構は常に無効化されたままにする方針とした。
#
# そこで、Calamares本体の未改造コードだけで「インストールが正常完了し、
# かつユーザーが『今すぐ再起動』を選択した場合」だけを正確に判定できる
# 唯一の場所である本設定の restartNowCommand を、volatileなmarker
# (/run/mypocketos/install-complete-reboot)を作成してから
# 通常どおり systemctl -i reboot を実行するだけの小さなwrapper
# (/usr/local/bin/mypocketos-installer-reboot、Live専用、
# shellprocess-livepurgeでInstalled環境から削除される)に差し替えた。
# 実際のメディア取り外し案内/eject処理は、このmarkerの有無だけで
# 分岐する別の新規systemd system-shutdown hook
# (/usr/lib/systemd/system-shutdown/mypocketos-install-media-removal)
# が担う。Calamares本体・calamares-settings-debian・Debian標準の
# live-medium-eject / live-tools.shutdown はいずれも無改造のまま。
#
# 「インストール失敗時」および「『今すぐ再起動』チェックを外した場合」に
# restartNowCommand が実行されないことは、Calamares 3.3.14の実ソース
# (src/modules/finished/Config.cpp / Config.h)で確認済み:
#   - Config::onInstallationFailed() がインストール失敗時に
#     setRestartNowMode(RestartMode::Never) を呼ぶ。
#   - Config::doRestart(bool restartAnyway) は
#     restartNowMode() != RestartMode::Never && restartAnyway
#     を満たさない限り restartNowCommand を実行しない。
#   - 引数無しの Config::doRestart() は
#     doRestart(restartNowWanted()) に委譲し、
#     restartNowWanted() は mode==Never なら常にfalse、
#     mode==Always なら常にtrue、それ以外(本設定の既定値である
#     restartNowChecked: true 相当の UserDefaultChecked)では
#     ユーザーが「今すぐ再起動」チェックボックスを操作した結果
#     (m_userWantsRestart、setRestartNowWanted() 経由でQMLと双方向
#     バインドされているQ_PROPERTY)をそのまま返す。
# つまりMyPocketOS側で成功/失敗判定ロジックを独自実装する必要はなく、
# Calamares本体の既存の安全機構をそのまま利用できる。
#
# 保守上の注意: 上記1点の変更以外は、calamares-settings-debianが
# 提供するfinished.confの内容(restartNowEnabled/restartNowChecked)を
# そのまま維持している。将来calamares-settings-debianパッケージが
# 更新された場合、このファイルは自動的には追従しない。
# =======================================================================
---
restartNowEnabled: true
restartNowChecked: true
restartNowCommand: "/usr/local/bin/mypocketos-installer-reboot"
