# MyPocketOS - LightDM GTK Greeter (ログイン画面) の背景
#
# Debian提供の /usr/share/lightdm/lightdm-gtk-greeter.conf.d/01_debian.conf
# (Debianのログイン背景を指定) を、MyPocketOS標準壁紙で上書きする。
# lightdm-gtk-greeterは、データディレクトリ側の conf.d → /etc/lightdm/
# lightdm-gtk-greeter.conf.d/*.conf (ファイル名順) → /etc/lightdm/
# lightdm-gtk-greeter.conf の順に読み込み、後から読んだ値が前の値を上書きする。
# 名前を50_とすることで、01_debian.confより後、かつパッケージ提供の
# conffile (/etc/lightdm/lightdm-gtk-greeter.conf) を書き換えずに済む。
#
# 画像パスだけを指定した場合は、縦横比を保って画面全体を覆う表示 (zoomed)
# になる (デスクトップの hsetroot -cover と同じ挙動)。
#
# 今回は背景のみ。ロゴ・独自GTKテーマ (theme-name)・default-user-image は
# 設定しない。
[greeter]
background=/usr/share/backgrounds/mypocketos/mypocketos-default.png
