# MyPocketOS - タッチパッド既定動作 (libinputドライバ向け)
#
# 目的: ノートPCで起動した直後から、機種やタッチパッド製品名に依存せず
# 次を有効にする。
#   - 1本指タップ  = 左クリック
#   - 2本指タップ  = 右クリック
#   - 3本指タップ  = libinput既定のTappingButtonMap (lrm) どおり中クリック
#   - 2本指スクロール (指を下へ動かすと表示内容も下へ動く、いわゆる
#     "natural scrolling"。タッチスクリーンで紙をめくる操作と同じ向き)
#   - タップ&ドラッグ (1本指タップ後そのまま指を置き続けるとドラッグ)
#   - 物理クリック (ボタン) は従来どおり使用可能 (Tappingは物理クリックを
#     置き換えるものではなく追加するもの)
#
# NaturalScrolling について:
# libinputドライバの既定 (未設定時) はNaturalScrolling無効であり、指を
# 下へ動かすとスクロールバーを下げるのと同じ向き、すなわち表示内容が
# 上へ動く「従来型」スクロールになる。本ファイルでは明示的に
# NaturalScrolling "on" を指定し、指を下へ動かした方向へ表示内容も動く
# 挙動にする (man 4 libinput の "Option NaturalScrolling" 参照)。
# USBマウスは MatchIsTouchpad "on" の対象外のため、本設定の影響を受けず
# 従来どおりのホイール方向のままとなる。
#
# `MatchIsTouchpad "on"` (デバイス名・vendor ID等のハードコードなし) で
# libinputがタッチパッドとして分類したデバイスにのみ適用する。マウス・
# トラックポイント (pointing stick)・タッチスクリーンはlibinput上で別の
# デバイスクラスとして扱われるため、本設定の対象にはならない。
#
# xserver-xorg-input-libinputパッケージが提供する既定の
# /usr/share/X11/xorg.conf.d/40-libinput.conf の
# "libinput touchpad catchall" セクションより後 (ファイル名で51、40より後)
# に読み込まれるようにし、同じデバイスに対して本ファイルのOptionが
# 優先されるようにする。
Section "InputClass"
        Identifier "MyPocketOS touchpad defaults"
        MatchIsTouchpad "on"
        MatchDevicePath "/dev/input/event*"
        Driver "libinput"

        Option "Tapping" "on"
        Option "TappingButtonMap" "lrm"
        Option "TappingDrag" "on"
        Option "ScrollMethod" "twofinger"
        Option "NaturalScrolling" "on"
EndSection
