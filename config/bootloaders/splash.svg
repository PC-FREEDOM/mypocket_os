<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="640"
  height="480"
  viewBox="0 0 640 480">

  <rect width="640" height="480" fill="#000000"/>

  <!-- logo -->
  <image
    x="56"
    y="44"
    width="96"
    height="96"
    preserveAspectRatio="xMidYMid meet"
    xlink:href="data:image/png;base64,"/>

  <!-- heading -->
  <text
    x="176"
    y="60"
    fill="#AFC7E8"
    font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"
    font-size="15">Live Boot Menu</text>

  <text
    x="176"
    y="102"
    fill="#FFFFFF"
    font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"
    font-size="34"
    font-weight="700">MyPocketOS</text>

  <text
    x="430"
    y="102"
    fill="#AFC7E8"
    font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"
    font-size="20">Live</text>

  <!-- build info -->
  <text
    x="176"
    y="130"
    fill="#D8E6F7"
    font-family="DejaVu Sans Mono, Liberation Mono, monospace"
    font-size="12">Built: @YEAR@-@MONTH@-@DAY@ @HOUR@:@MINUTE@ @TIMEZONE@</text>

  <text
    x="176"
    y="150"
    fill="#D8E6F7"
    font-family="DejaVu Sans Mono, Liberation Mono, monospace"
    font-size="12">Kernel: @LINUX_VERSIONS@</text>

</svg>
